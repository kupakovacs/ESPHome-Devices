esphome:
  name: outdoor-bme280-sensor
  friendly_name: Outdoor BME280 Sensor

esp8266:
  board: esp01_1m

logger:

api:

ota:
  - platform: esphome
    password: !secret outdoor_bme280_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Outdoor-Bme280-Sensor"
    password: !secret outdoor_bme280_ap_password

captive_portal:

i2c:
  sda: GPIO14
  scl: GPIO02
  scan: true
  id: bus_a

sensor:
  - platform: bme280_i2c
    temperature:
      name: "Outdoor Temperature"
      id: bme_temp
      oversampling: 16x
    pressure:
      name: "Outdoor Pressure"
    humidity:
      name: "Outdoor Humidity"
    address: 0x76
    update_interval: 60s