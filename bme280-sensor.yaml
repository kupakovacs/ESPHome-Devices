esphome:
  name: outdoor-bme280-sensor
  friendly_name: outdoor_bme280_sensor

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:

ota:
  - platform: esphome
    password: "08e6e2fc5e67a0d5ec191fb3d318b86a"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Outdoor-Bme280-Sensor"
    password: "prIcq8GsgT1I"

captive_portal:
    
# I2C setup for BME280
i2c:
  sda: GPIO14   # D4
  scl: GPIO02  # D5
  scan: true
  id: bus_a

# BME280 sensor
sensor:
  - platform: bme280_i2c
    temperature:
      name: "Outdoor Temperature"
      id: bme_temp
      oversampling: 16x
    pressure:
      name: "Outdoor Pressure"
    humidity:
      name: "Outdoor Humidity"
    address: 0x76  # Change to 0x77 if detection fails
    update_interval: 60s